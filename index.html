const INTERVAL=[0,1,2,4,7,15];      // box -> 天数
const DAY=86400000;

/* ---------- 状态 ---------- */
let S=load();
function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.v)return o}catch(e){}
  return {v:1,items:{},goal:15,accent:'en-US',rate:0.9,auto:true,days:[],today:{},lastCatIdx:0};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function it(id){
  if(!S.items[id])S.items[id]={box:0,due:0,seen:0,mastered:0};
  return S.items[id];
}
function learnedCount(){return Object.keys(S.items).filter(k=>S.items[k].seen>0).length}
function masteredCount(){return Object.keys(S.items).filter(k=>S.items[k].mastered).length}
function dueList(){
  const now=Date.now();
  return DATA.filter(d=>{const s=S.items[d.id];return s&&s.seen>0&&s.due<=now&&!s.mastered});
}
function newList(){
  return DATA.filter(d=>!S.items[d.id]||S.items[d.id].seen===0)
    .sort((a,b)=>(b.star-a.star)||(CATORD[a.cat]-CATORD[b.cat])||(a.id-b.id));
}
function todayDone(){const t=today();return S.today&&S.today[t]?S.today[t]:0;}

/* ---------- 发音 ---------- */
let VOICE=null;
function loadVoices(){
  const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  if(!vs.length)return;
  const want=S.accent;
  VOICE=vs.find(v=>v.lang===want&&/natural|enhanced|premium|google/i.test(v.name))
     ||vs.find(v=>v.lang===want)
     ||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function warm(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function ttsText(s){
  let t=String(s);
  t=t.replace(/\s*\([^)]*\)\s*/g,' ');
  t=t.replace(/\s*\/\s*/g,', ');
  t=t.replace(/\//g,' ');
  return t.replace(/\s+/g,' ').trim();
}
function speak(txt){
  if(!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(ttsText(txt));
    u.lang=S.accent;u.rate=parseFloat(S.rate)||0.9;
    if(VOICE)u.voice=VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- UI 基础 ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1200)}
function jattr(s){return JSON.stringify(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function stars(n){return '★'.repeat(n)}
function catChip(d){return '<span class="chip">'+d.cat+(d.tag?' · '+d.tag:'')+'</span><span class="chip star">'+stars(d.star)+'</span>'}

/* ---------- 卡片渲染 ---------- */
let cur=null,curMode='learn',curFlipped=false;
function cardHTML(d,i,total){
  const short=d.kind==='phrase';
  return '<div class="card" id="card'+d.id+'">'
   +'<div class="card-inner">'
     +'<div class="face front" onclick="flip()">'
       +'<div class="mtrow" style="justify-content:center">'+catChip(d)+'<span class="chip idx">'+(i+1)+'/'+total+'</span></div>'
       +'<div class="wd'+(short?' small':'')+'">'+esc(d.en)+'</div>'
       +'<div class="tip-short">👆 点击卡片看中文</div>'
       +'<button class="spk" onclick="event.stopPropagation();speak('+jattr(d.en)+')">🔊</button>'
       +'<div class="hint">英文发音 · 点喇叭可重听</div>'
     +'</div>'
     +'<div class="face back">'
       +'<div class="mtrow">'+catChip(d)+'</div>'
       +'<div class="cn">'+esc(d.cn)+'</div>'
       +(d.ex?'<div class="ex"><div class="en">'+esc(d.ex)+'</div>'+(d.exCn?'<div class="cnl">'+esc(d.exCn)+'</div>':'')+'</div>':'')
       +(d.tip?'<div class="tip">💡 '+esc(d.tip)+'</div>':'')
       +'<div class="speakline">'
         +'<button class="mini" onclick="speak('+jattr(d.en)+')">🔊 读单词</button>'
         +(d.ex?'<button class="mini" onclick="speak('+jattr(d.ex)+')">🔊 读例句</button>':'')
       +'</div>'
     +'</div>'
   +'</div></div>';
}
function gradeHTML(){
  return '<div class="grade">'
   +'<button class="g0" onclick="grade(0)">😵 不认识</button>'
   +'<button class="g1" onclick="grade(1)">😐 模糊</button>'
   +'<button class="g2" onclick="grade(2)">😎 掌握</button>'
   +'</div><div class="ghint"><span>明天再来</span><span>2天后</span><span>进入长期记忆</span></div>';
}
function flip(){
  const c=document.querySelector('#learnBox .card, #revBox .card');if(!c)return;
  c.classList.toggle('flip');curFlipped=!curFlipped;
  if(curFlipped&&S.auto)speak(cur.ex||cur.en);
}
function grade(g){
  if(!cur)return;
  const s=it(cur.id);s.seen=(s.seen||0)+1;
  if(g===0){s.box=0;s.due=Date.now()+10*60000;}
  else if(g===1){s.box=Math.min(s.box,1);s.due=Date.now()+INTERVAL[1]*DAY;}
  else{s.box=Math.min(s.box+1,INTERVAL.length-1);s.due=Date.now()+INTERVAL[s.box]*DAY;if(s.box>=3)s.mastered=1;}
  if(curMode==='learn'){
    const t=today();S.today=S.today||{};S.today[t]=(S.today[t]||0)+1;
    if(S.days.indexOf(t)<0){S.days.push(t);S.days=S.days.slice(-400)}
  }
  save();renderLearn();renderReview();renderHead();
  if(curMode==='learn'&&todayDone()===S.goal)setTimeout(()=>toast('🎉 今日目标 '+S.goal+' 条完成！'),320);
}

/* ---------- 渲染：学习 ---------- */
function renderLearn(){
  const box=document.getElementById('learnBox');
  const goal=S.goal, done=todayDone();
  if(done>=goal){
    box.innerHTML='<div class="empty"><div class="ico">🎉</div><p><b>今日 '+goal+' 条已完成</b><br>碎片时间别浪费，去「听音」练耳朵</p>'
      +'<button class="b" onclick="more()">💪 再学一轮（'+S.goal+' 条）</button>'
      +'<button class="b" style="background:#EEF1F6;color:#42506B" onclick="go(\'t-listen\')">👂 听音辨义</button></div>';
    cur=null;return;
  }
  const pool=newList();
  if(!pool.length){box.innerHTML='<div class="empty"><div class="ico">🏁</div><p>全部词条已学完<br>去「复习」巩固吧</p><button class="b" onclick="go(\'t-review\')">🔁 去复习</button></div>';cur=null;return;}
  cur=pool[0];curMode='learn';curFlipped=false;
  box.innerHTML='<div style="font-size:12.5px;color:#8A94A6;margin-bottom:6px">📖 新学 · 建议顺序：缩写 → 商务 → 医药 → 数据 → 句式</div>'
    +cardHTML(cur,done,goal)+gradeHTML();
  if(S.auto)setTimeout(()=>speak(cur.en),260);
}
function more(){const t=today();S.today=S.today||{};S.today[t]=0;save();renderLearn();renderHead();}

/* ---------- 渲染：复习 ---------- */
function renderReview(){
  const box=document.getElementById('revBox');
  const due=dueList().sort((a,b)=>S.items[a.id].due-S.items[b.id].due);
  document.getElementById('navDue').textContent=due.length?'('+due.length+')':'';
  if(!due.length){
    box.innerHTML='<div class="empty"><div class="ico">✅</div><p>暂时没有到期要复习的<br>碎片时间可以去学新词</p><button class="b" onclick="go(\'t-learn\')">📖 学新词</button></div>';return;
  }
  cur=due[0];curMode='review';curFlipped=false;
  box.innerHTML='<div style="font-size:12.5px;color:#8A94A6;margin-bottom:6px">🔁 待复习 '+due.length+' 条 · 按遗忘曲线排序</div>'
    +cardHTML(cur,0,due.length)+gradeHTML();
  if(S.auto)setTimeout(()=>speak(cur.en),260);
}

/* ---------- 听音辨义 ---------- */
let lisAns=null;
function renderListen(){
  const box=document.getElementById('lisBox');
  const pool=DATA.filter(d=>d.kind!=='phrase');
  const right=pool[Math.floor(Math.random()*pool.length)];
  const wrongs=[];let guard=0;
  while(wrongs.length<3&&guard++<200){
    const w=pool[Math.floor(Math.random()*pool.length)];
    if(w.id!==right.id&&w.cn!==right.cn&&!wrongs.some(x=>x.cn===w.cn))wrongs.push(w);
  }
  const opts=[right].concat(wrongs).sort(()=>Math.random()-0.5);
  lisAns=right;
  box.innerHTML='<div style="font-size:12.5px;color:#8A94A6;margin-bottom:10px">👂 听英文读音，选中文意思（练耳朵，开车/地铁也能玩）</div>'
   +'<div class="stat" style="text-align:center">'
     +'<button class="spk" style="margin:6px auto 12px" onclick="speak('+jattr(right.en)+')">🔊</button>'
     +'<div style="font-size:12px;color:#98A1B0">点喇叭听读音（可反复听）</div>'
   +'</div>'
   +opts.map(o=>'<button class="item" style="width:100%" onclick="pick('+o.id+','+right.id+')">'
      +'<div class="l"><div class="c" style="margin-top:0;font-size:14px;color:#12243D">'+esc(o.cn)+'</div></div></button>').join('')
   +'<button class="btn gray" onclick="renderListen()">🔀 换一题</button>';
  setTimeout(()=>{if(S.auto)speak(right.en)},300);
}
function pick(id,right){
  if(id===right){toast('✅ 正确！');it(right);const s=it(right);if(!s.seen)s.seen=1;save();setTimeout(renderListen,700);}
  else{toast('❌ 再听一次');}
}

/* ---------- 词表 ---------- */
let fCat='全部',fStar='全部';
function renderFilters(){
  document.getElementById('fcat').innerHTML=['全部'].concat(CATS)
    .map(c=>'<button class="'+(fCat===c?'on':'')+'" onclick="setCat(\''+c+'\')">'+c+'</button>').join('');
  document.getElementById('fstar').innerHTML=['全部','★★★','★★','★']
    .map(c=>'<button class="'+(fStar===c?'on':'')+'" onclick="setStar(\''+c+'\')">'+c+'</button>').join('');
}
function setCat(c){fCat=c;renderFilters();renderList()}
function setStar(c){fStar=c;renderFilters();renderList()}
function renderList(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const rows=DATA.filter(d=>{
    if(fCat!=='全部'&&d.cat!==fCat)return false;
    if(fStar!=='全部'&&stars(d.star)!==fStar)return false;
    if(q&&!((d.en+' '+d.cn+' '+d.ex+' '+(d.tip||'')).toLowerCase().includes(q)))return false;
    return true;
  });
  document.getElementById('listBox').innerHTML=rows.length?rows.map(d=>{
    const s=S.items[d.id];const lv=s?(s.mastered?1:s.seen?2:3):3;
    return '<div class="item'+(d._open?' open':'')+'" onclick="tog(this,'+d.id+')">'
      +'<div class="l"><div class="e">'+esc(d.en)+'</div><div class="c">'+esc(d.cn)+'</div></div>'
      +'<div class="r"><span class="dot d'+lv+'"></span><span style="font-size:10.5px;color:#A6AEBB">'+stars(d.star)+'</span></div>'
    +'</div><div class="detail" data-id="'+d.id+'">'
      +(d.ex?'<div style="margin-bottom:6px"><b>例句：</b>'+esc(d.ex)+'</div>':'')
      +(d.exCn?'<div style="margin-bottom:6px;color:#6B7688">'+esc(d.exCn)+'</div>':'')
      +(d.tip?'<div style="color:#B47600">💡 '+esc(d.tip)+'</div>':'')
      +'<div style="margin-top:10px;display:flex;gap:8px">'
        +'<button class="mini" onclick="event.stopPropagation();speak('+jattr(d.en)+')">🔊 读音</button>'
        +'<button class="mini" onclick="event.stopPropagation();markMaster('+d.id+')">✔ 标记掌握</button>'
      +'</div>'
    +'</div>';
  }).join(''):'<div class="empty"><p>没有匹配的词条</p></div>';
  document.getElementById('listBox').insertAdjacentHTML('beforeend','<div style="font-size:11.5px;color:#A6AEBB;text-align:center;padding:10px">共 '+rows.length+' 条 · 点词条展开详情</div>');
}
function tog(el,id){el.classList.toggle('open');speak(DATA.find(d=>d.id===id).en)}
function markMaster(id){const s=it(id);s.seen=s.seen||1;s.mastered=1;s.box=5;s.due=Date.now()+15*DAY;save();toast('已标记掌握');renderHead();}

   +'<button class="btn gray" onclick="document.getElementById(\'imp\').click()">⬇ 恢复进度（导入文件）</button>'
   +'<input type="file" id="imp" accept="application/json" style="display:none" onchange="impData(this)">'

function calcStreak(){
  const set=new Set(S.days||[]);let n=0,d=new Date();
  for(let i=0;i<400;i++){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(set.has(k)){n++}else if(i>0){break}
    d=new Date(d.getTime()-DAY);
  }
  return n;
}
function tgAuto(el){S.auto=!S.auto;el.classList.toggle('on',S.auto);save()}
function saveSet(){
  S.goal=parseInt(document.getElementById('sGoal').value)||15;
  S.accent=document.getElementById('sAcc').value;
  S.rate=parseFloat(document.getElementById('sRate').value);
  save();loadVoices();toast('已保存');renderHead();renderLearn();
}
function expData(){
  const b=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='商务英语进度备份_'+today()+'.json';a.click();toast('已导出');
}
function impData(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.v){S=o;save();toast('已恢复');renderAll()}}catch(e){toast('文件格式不对')}};
  r.readAsText(f);el.value='';
}
function resetAll(){
  if(!confirm('确定清空全部学习进度？此操作不可恢复。'))return;
  S={v:1,items:{},goal:S.goal,accent:S.accent,rate:S.rate,auto:S.auto,days:[],today:{}};
  save();renderAll();toast('已清空');
}

/* ---------- 头部 / 导航 ---------- */
function renderHead(){
  const L=learnedCount(),T=DATA.length;
  document.getElementById('pbar').style.width=Math.round(L/T*100)+'%';
  document.getElementById('hdL').textContent='已学 '+L+' / '+T+' · 掌握 '+masteredCount();
  document.getElementById('hdR').textContent='今日 '+todayDone()+' / '+S.goal;
}
function go(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));
  window.scrollTo(0,0);
  if(id==='t-listen')renderListen();
  if(id==='t-me')renderMe();
  if(id==='t-list')renderList();
  if(id==='t-learn')renderLearn();
  if(id==='t-review')renderReview();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{warm();go(b.dataset.t)});
document.getElementById('q').oninput=renderList;

function renderAll(){renderHead();renderFilters();renderList();renderLearn();renderReview();}
renderAll();

      +'之后点桌面图标就能全屏使用，跟 App 一样，<b>断网也能用</b>。';
    document.getElementById('mask').classList.add('on');
    localStorage.setItem('vocab_seen_guide','1');
  },900);
}
document.getElementById('mask').onclick=function(){this.classList.remove('on')};

/* 跨天自动重置今日计数 */
setInterval(()=>{renderHead()},60000);
</script>
